name: Release

# Deploys main to production. Started by hand (`gh workflow run release.yml`)
# once scripts/ci-local.sh has passed on the commit and it's pushed — on the
# self-hosted Mac, never on GitHub's hosted runners.
#
# The server side is unchanged: it pulls main, builds the images, runs the
# schema migration with the new code, restarts, and checks health. Plain ssh
# from the Mac (a Docker-based SSH action can't run on a macOS runner).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'miladmahdavilayen/claude_built_poker'
    runs-on: [self-hosted, macOS, gpu]
    timeout-minutes: 30
    steps:
      - name: SSH in and redeploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # 'ubuntu' on the Oracle server (root SSH is disabled there); set
          # via the DEPLOY_USER secret so the host can change without an edit.
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts_pokerclause" \
            -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA=$RELEASE_SHA bash -s" <<'DEPLOY' | tee "$dir/out"
          set -e
          cd /opt/pokerclause
          git fetch origin main
          git reset --hard origin/main
          echo "Releasing $(git rev-parse --short HEAD) (dispatched at ${RELEASE_SHA:0:7})"
          # Build the new images WITHOUT starting them yet — a schema
          # migration (if this release has one) needs to run against the
          # NEW code before the server itself restarts, or it boots
          # straight into "relation does not exist" and crash-loops
          # (see DECISIONS.md — this happened on the very first manual
          # deploy, before this pipeline existed).
          # Nothing here may read stdin: this script itself IS stdin (ssh … bash -s), and a command that reads
          # it (docker compose run, by default) swallows every line after it — the restart below never ran.
          docker compose build < /dev/null
          docker compose run --rm -T server pnpm db:migrate < /dev/null
          docker compose up -d < /dev/null
          docker image prune -f < /dev/null
          # Build layers pile up on every deploy (24 GB on the old host
          # before anyone noticed); keep only the last week's for speed.
          docker builder prune -f --filter until=168h < /dev/null
          # Fail the job loudly if the server didn't actually come back up
          # healthy — a broken deploy should turn this run red, not look
          # identical to a working one in the Actions UI.
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then
              echo "Server healthy."
              # The script ran to its end (see the check after ssh).
              echo "RELEASE-COMPLETE"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy after deploy — logs:"
          docker compose logs server --tail 50 < /dev/null
          exit 1
          DEPLOY
          # A script cut short (a command reading its stdin swallowed the rest — it happened) exits 0 too:
          # only the marker from its very end says it really deployed.
          grep -q '^RELEASE-COMPLETE$' "$dir/out" || { echo "The deploy script didn't run to its end."; exit 1; }
      - name: Production answers
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://api.pokerclause.com/health
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 -o /dev/null https://www.pokerclause.com/
