server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress what's worth it — the dealer characters (.fbx, served as
    # octet-stream) shrink by about a third.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/octet-stream application/json application/manifest+json text/css application/javascript image/svg+xml;

    # Vite's bundles carry a content hash in their names: a new build is a new file, so they never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The dealer characters and the card faces are big and rarely change:
    # each device downloads them once and keeps them for 30 days. (Replacing
    # one? Give it a new file name, or players keep the old one that long.)
    location ~ ^/(models|cards)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The page itself: always checked, so a deploy reaches everyone at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
