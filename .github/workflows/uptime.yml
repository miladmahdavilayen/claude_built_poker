name: Uptime

# Checks production from outside Oracle every 15 minutes. A failed run makes
# GitHub email the repo owner, so an outage (or Oracle stopping/reclaiming
# the free server) is noticed even if every Oracle-side alarm is gone with it.
# Note: GitHub pauses scheduled workflows in a public repo after 60 days with
# no commits — re-enable it from the Actions tab if that ever happens.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Game server health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://api.pokerclause.com/health
      - name: Website
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://www.pokerclause.com/
