services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokerclause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokerclause}
      POSTGRES_DB: ${POSTGRES_DB:-pokerclause}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pokerclause}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-pokerclause}:${POSTGRES_PASSWORD:-pokerclause}@postgres:5432/${POSTGRES_DB:-pokerclause}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_DEFAULT_TABLES: ${SEED_DEFAULT_TABLES:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  pgdata:
