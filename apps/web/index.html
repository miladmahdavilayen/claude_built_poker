<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- The ONLY way to actually hide Safari's own address bar/tab UI on an
         iPhone — the in-page "Full screen" toggle (useImmersiveMode.ts) can
         only hide this app's own chrome, since iOS Safari doesn't support
         the Fullscreen API for arbitrary elements. This meta tag is what
         makes "Add to Home Screen" launch as a genuine chrome-free
         standalone window instead of a normal Safari tab. See README.md. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pokerclause" />
    <title>pokerclause</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Loaded unconditionally, but only ever used if VITE_GOOGLE_CLIENT_ID is
         set — see GoogleSignInButton.tsx, which renders nothing without it. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
