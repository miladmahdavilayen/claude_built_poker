services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokerclause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokerclause}
      POSTGRES_DB: ${POSTGRES_DB:-pokerclause}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: Postgres has no reason to be reachable from outside
      # this machine, and Redis (below) has no auth configured at all by
      # default — publishing either on 0.0.0.0 exposes them to the whole
      # internet on any real deployment. `db:migrate`/`db:seed` (run via
      # `docker compose exec`) reach this over the internal Docker network
      # regardless, and `localhost:5432` from the host machine itself still
      # works fine — this only blocks OTHER machines from reaching it.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pokerclause}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379' # see postgres's port comment above — same reasoning

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-pokerclause}:${POSTGRES_PASSWORD:-pokerclause}@postgres:5432/${POSTGRES_DB:-pokerclause}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_DEFAULT_TABLES: ${SEED_DEFAULT_TABLES:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # Loopback-only, same reasoning as postgres/redis above — a real
      # deployment fronts this with a reverse proxy (for TLS, among other
      # things — see README's deployment section) rather than exposing the
      # app container directly. `localhost:4000` from this machine still
      # works exactly as the quickstart below describes.
      - '127.0.0.1:4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '127.0.0.1:5173:80' # see server's port comment above — same reasoning

volumes:
  pgdata:
